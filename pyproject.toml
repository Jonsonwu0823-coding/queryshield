[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "queryshield"
version = "0.1.0"
description = "A small governed query service used for the W01 practice slice."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "cryptography>=50,<51",
    "httpx>=0.27,<1",
    "langgraph>=1.2,<2",
    "mcp>=2.2,<3",
    "pydantic>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
